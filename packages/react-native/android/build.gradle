apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.motionprobe'
version = '0.1.0'

android {
  namespace "expo.modules.motionprobe"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // testID tag key (R.id.react_test_id) and ReactOverflowView
  implementation 'com.facebook.react:react-android'
}
