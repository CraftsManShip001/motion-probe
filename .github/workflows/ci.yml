name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Typecheck React Native package + demo
        working-directory: examples/demo
        run: npx tsc --noEmit -p tsconfig.json

  ios-native:
    name: Compile iOS probe (Expo prebuild + xcodebuild)
    runs-on: macos-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Prebuild
        working-directory: examples/demo
        run: npx expo prebuild --platform ios
      - name: Build for simulator
        working-directory: examples/demo/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace MotionProbeDemo.xcworkspace \
            -scheme MotionProbeDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -50

  android-native:
    name: Compile Android probe (Expo prebuild + Gradle)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      # ubuntu-latest ships the Android SDK with its licenses accepted; setup-android's sdkmanager run
      # kept failing on license prompts, so the preinstalled SDK is used as is.
      - run: npm ci
      - name: Prebuild
        working-directory: examples/demo
        run: npx expo prebuild --platform android
      - name: Assemble debug APK
        working-directory: examples/demo/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
